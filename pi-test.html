<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BirdID Lite Pi Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="card" style="max-width:720px;margin:2rem auto;text-align:center;">
      <h1>BirdID Lite Pi Test</h1>
      <p>This temporary page is only for completing the Pi Testnet app checklist.</p>
      <p><strong>Test page version:</strong> 2026-07-26-v2</p>
      <p>No real BirdID Lite payment is required for the public launch.</p>

      <button id="login-pi" class="btn">Sign in with Pi</button>
      <button id="test-payment" class="btn" disabled>Process Test Transaction</button>

      <p id="status" style="margin-top:1rem;font-weight:600;"></p>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("login-pi");
    const payBtn = document.getElementById("test-payment");

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    if (!window.Pi) {
      setStatus("Pi SDK not found. Open this page inside Pi Browser.");
    } else {
      Pi.init({ version: "2.0", sandbox: true });
      console.log("BirdID Pi test page version 2026-07-26-v2 loaded");
      setStatus("Pi SDK loaded. Please sign in.");
    }

    loginBtn.addEventListener("click", function () {
      if (!window.Pi) {
        setStatus("Open this page inside Pi Browser.");
        return;
      }

      Pi.authenticate(["payments"], function (payment) {
        console.log("Incomplete payment found:", payment);
        setStatus("Incomplete payment found. For this test, try again or cancel it in Pi Browser.");
      }).then(function (auth) {
        console.log("Authenticated:", auth);
        setStatus("Signed in. You can now process the test transaction.");
        payBtn.disabled = false;
      }).catch(function (err) {
        console.error(err);
        setStatus("Pi sign-in failed or was cancelled.");
      });
    });

    payBtn.addEventListener("click", function () {
      if (!window.Pi) {
        setStatus("Open this page inside Pi Browser.");
        return;
      }

      setStatus("Opening Pi test payment...");

      Pi.createPayment({
        amount: 0.01,
        memo: "BirdID Lite Testnet checklist transaction",
        metadata: {
          app: "BirdID Lite",
          purpose: "testnet-checklist"
        }
      }, {
      onReadyForServerApproval: async function(paymentId) {
  console.log("Ready for server approval:", paymentId);
  setStatus("Approving payment on server...");

    try {
    const res = await fetch("https://married-bathrooms-snow-excuse.trycloudflare.com/api/pi/approve", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ paymentId: paymentId })
    });

    const data = await res.json();
    console.log("Approve response:", data);

    if (!res.ok || !data.ok) {
      setStatus("Server approval failed: " + (data.error || "unknown error"));
      return;
    }

    setStatus("Payment approved. Complete it in Pi Browser.");
  } catch (err) {
    console.error(err);
    setStatus("Server approval error: " + err.message);
  }
},

onReadyForServerCompletion: async function(paymentId, txid) {
  console.log("Ready for server completion:", paymentId, txid);
  setStatus("Completing payment on server...");

  try {
    const res = await fetch("https://married-bathrooms-snow-excuse.trycloudflare.com/api/pi/complete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        paymentId: paymentId,
        txid: txid
      })
    });

    const data = await res.json();
    console.log("Complete response:", data);

    if (!res.ok || !data.ok) {
      setStatus("Server completion failed: " + (data.error || "unknown error"));
      return;
    }

    setStatus("Payment completed successfully. Check the Pi Developer checklist.");
  } catch (err) {
    console.error(err);
    setStatus("Server completion error: " + err.message);
  }
},
        onCancel: function(paymentId) {
          console.log("Payment cancelled:", paymentId);
          setStatus("Payment cancelled.");
        },
        onError: function(error, payment) {
          console.error("Payment error:", error, payment);
          setStatus("Payment error. See console or try again in Pi Browser.");
        }
      });
    });
  </script>
</body>
</html>
